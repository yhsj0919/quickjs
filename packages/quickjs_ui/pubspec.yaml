name: quickjs_ui
description: "Declarative Flutter UI layer powered by package:quickjs."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.0
  flutter: '>=3.3.0'

dependencies:
  archive: ^4.0.9
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  quickjs:
    path: ../../

executables:
  manifest: manifest

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - js/quickjs_ui.schema.json
