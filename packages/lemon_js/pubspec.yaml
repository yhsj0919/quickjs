name: lemon_js
description: "QuickJS JavaScript engine for Flutter — cross-platform FFI and WebAssembly."
version: 0.2.0
homepage: https://github.com/yhsj0919/quickjs
repository: https://github.com/yhsj0919/quickjs
issue_tracker: https://github.com/yhsj0919/quickjs/issues

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  crypto: ^3.0.7
  ffi: ^2.2.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
  web: ^1.1.1
  archive: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  assets:
    - assets/js/axios.js
    - assets/web/quickjs.wasm
    - assets/web/quickjs_wasi.js
    - assets/web/wasi-shim.js
    - assets/web/extensions.js
    - assets/web/version.js
    - assets/web/quickjs_bridge.mjs
    - assets/web/quickjs_web.js
    - assets/web/quickjs_web_worker.js

  plugin:
    platforms:
      android:
        package: xyz.yhsj.lemon_js
        pluginClass: LemonJsPlugin
        ffiPlugin: true
      ios:
        pluginClass: LemonJsPlugin
        ffiPlugin: true
        sharedDarwinSource: true
      linux:
        pluginClass: LemonJsPlugin
        ffiPlugin: true
      macos:
        pluginClass: LemonJsPlugin
        ffiPlugin: true
        sharedDarwinSource: true
      windows:
        pluginClass: LemonJsPluginCApi
        ffiPlugin: true
      web:
        pluginClass: JsWeb
        fileName: lemon_js_web.dart
